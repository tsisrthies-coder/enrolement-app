<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEN-CSU Thiès</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b7a3e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SEN-CSU">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    html,body{margin:0;height:100%;background:#0b7a3e;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
    iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#f3f6f4;padding-top:env(safe-area-inset-top);box-sizing:border-box}
    .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
    .splash img{width:96px;height:96px;border-radius:24px}
    .spin{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .msg{max-width:420px}.msg code{background:rgba(255,255,255,.18);padding:2px 6px;border-radius:6px;word-break:break-all}
    #offline{position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;text-align:center;padding:8px 12px calc(8px);font-weight:600;z-index:10}
    button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;background:#fff;color:#0b7a3e}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="offline" hidden>📵 Pas de connexion Internet : l'enrôlement nécessite le réseau.</div>
  <div class="splash" id="splash"><img src="icons/icon-192.png" alt=""><div class="spin"></div><div>SEN-CSU Thiès</div></div>
  <div class="splash" id="setup" hidden>
    <img src="icons/icon-192.png" alt="">
    <div class="msg"><b>Configuration à terminer</b><p>Ouvrez le fichier <code>config.js</code> et collez l'adresse <code>/exec</code> de votre application Apps Script.</p></div>
  </div>
  <div class="splash" id="fail" hidden>
    <img src="icons/icon-192.png" alt="">
    <div class="msg"><b>Connexion impossible</b><p>Vérifiez votre réseau, puis réessayez.</p></div>
    <button id="retry">Réessayer</button>
  </div>
  <iframe id="app" title="SEN-CSU" allow="camera; clipboard-write; fullscreen" hidden></iframe>
  <script src="config.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var url = window.APP_URL || '';
      var frame = $('app'), loaded = false, timer = null;

      function updateOnline() { $('offline').hidden = navigator.onLine; }
      window.addEventListener('online', function () { updateOnline(); if (!loaded) start(); });
      window.addEventListener('offline', updateOnline);
      updateOnline();

      function start() {
        if (!/^https:\/\/script\.google\.com\//.test(url)) { $('splash').hidden = true; $('setup').hidden = false; return; }
        $('fail').hidden = true; $('splash').hidden = false;
        clearTimeout(timer);
        timer = setTimeout(function () { if (!loaded) { $('splash').hidden = true; $('fail').hidden = false; } }, 25000);
        frame.onload = function () { loaded = true; clearTimeout(timer); $('splash').hidden = true; $('fail').hidden = true; frame.hidden = false; };
        loaded = false; frame.src = url;
      }
      $('retry').onclick = start;
      start();

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    })();
  </script>
</body>
</html>
